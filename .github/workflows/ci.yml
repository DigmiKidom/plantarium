# Automatic checks on every push and pull request.
# On main, after every check passes, new database migrations are applied to production (job "migrate").
# In Vercel → Settings → Deployment Checks, require "Migrate production database" so the site goes live only after it.
# The same checks run locally with: npm run check (and npm run build).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older, still-running check.
# (Never on main: a database update must not be stopped halfway.)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint (code style, React hooks, RTL rules)
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Unit tests (search, care planner, schemas, plant data)
        run: npm test
      - name: Database – all migrations, plant data and security rules (RLS)
        run: npm run db:test
      - name: Plant data – every species in species.json is in a migration
        run: node scripts/species-migration.mjs --check
      - name: Security – known vulnerable packages
        run: npm audit --audit-level=high --omit=dev

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      # No secrets needed: without Supabase settings the site builds from the local plant data.
      - name: next build
        run: npm run build

  migrate:
    name: Migrate production database
    needs: [checks, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip when not set up yet
        if: env.SUPABASE_DB_URL == ''
        run: echo "::notice::SUPABASE_DB_URL secret is not set – migrations were not applied. Run npm run db:push yourself, or add the secret (see docs/operations.md)."
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_DB_URL != ''
        with:
          version: latest
      - name: Pending migrations
        if: env.SUPABASE_DB_URL != ''
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
      - name: Apply migrations
        if: env.SUPABASE_DB_URL != ''
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes
